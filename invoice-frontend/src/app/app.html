<ng-container *ngIf="showShell; else publicView">
  <div
    class="flex h-screen overflow-hidden bg-[#F5F6FA] dark:bg-[#0F1117] transition-colors duration-300"
  >
    <!-- Sidebar -->
    <aside
      class="w-64 flex-shrink-0 flex flex-col h-full bg-white dark:bg-[#1A1D2E] border-r border-gray-100 dark:border-gray-800 shadow-sm"
    >
      <!-- Logo -->
      <div class="px-6 py-5 flex items-center gap-3 border-b border-gray-100 dark:border-gray-800">
        <div
          class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-violet-200 dark:shadow-violet-900/30 flex-shrink-0"
        >
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
        </div>
        <div>
          <h1 class="text-gray-900 dark:text-white font-bold text-base tracking-tight">
            Platform Intelligent
          </h1>
          <p class="text-gray-400 dark:text-gray-500 text-xs mt-0.5">INET Platform</p>
        </div>
      </div>

      <!-- Nav label -->
      <div class="px-6 pt-5 pb-2">
        <p
          class="text-[10px] font-semibold tracking-widest text-gray-400 dark:text-gray-600 uppercase"
        >
          Menu
        </p>
      </div>

      <!-- Nav links -->
      <nav class="flex-1 px-3 space-y-1">
        <a
          *ngIf="isAdmin"
          routerLink="/dashboard"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"
            />
          </svg>
          <span class="text-sm font-medium">Tableau de bord</span>
        </a>

        <a
          routerLink="/upload"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            />
          </svg>
          <span class="text-sm font-medium">Importer Facture</span>
        </a>

        <a
          routerLink="/invoices"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
            />
          </svg>
          <span class="text-sm font-medium">Factures</span>
          <span
            *ngIf="totalFactures > 0"
            class="ml-auto text-[10px] font-bold px-2 py-0.5 rounded-full bg-violet-600 text-white min-w-[20px] text-center"
          >
            {{ totalFactures }}
          </span>
        </a>

        <a
          routerLink="/agent"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"
            />
          </svg>
          <span class="text-sm font-medium">Agent IA</span>
          <mat-icon
            class="app-icon app-icon-sm ml-auto text-violet-600 dark:text-violet-400"
            aria-hidden="true"
            >auto_awesome</mat-icon
          >
        </a>

        <a
          *ngIf="isAdmin"
          routerLink="/audit"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M9 17v-2m3 2v-4m3 4V9m2 10H7a2 2 0 01-2-2V7a2 2 0 012-2h10a2 2 0 012 2v10a2 2 0 01-2 2z"
            />
          </svg>
          <span class="text-sm font-medium">Piste D'audit</span>
        </a>

        <a
          *ngIf="isAdmin"
          routerLink="/comptables"
          routerLinkActive="active-nav"
          class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl text-gray-500 dark:text-gray-400 hover:text-violet-600 dark:hover:text-violet-400 hover:bg-violet-50 dark:hover:bg-violet-900/20 transition-all duration-200 cursor-pointer"
        >
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M17 20h5V9H2v11h5m10 0v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6m10 0H7m5-11a3 3 0 110-6 3 3 0 010 6z"
            />
          </svg>
          <span class="text-sm font-medium">Comptables</span>
        </a>
      </nav>

      <!-- Bottom -->
      <div class="px-4 py-4 border-t border-gray-100 dark:border-gray-800 space-y-3">
        <!-- Dark mode toggle -->
        <button
          (click)="toggleDark()"
          class="w-full flex items-center justify-between px-4 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-all duration-200"
        >
          <div class="flex items-center gap-2.5">
            <svg
              *ngIf="!darkMode"
              class="w-4 h-4 text-amber-500"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"
              />
            </svg>
            <svg
              *ngIf="darkMode"
              class="w-4 h-4 text-indigo-400"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M9.528 1.718a.75.75 0 01.162.819A8.97 8.97 0 009 6a9 9 0 009 9 8.97 8.97 0 003.463-.69.75.75 0 01.981.98 10.503 10.503 0 01-9.694 6.46c-5.799 0-10.5-4.701-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 01.818.162z"
              />
            </svg>
            <span class="text-xs font-medium text-gray-600 dark:text-gray-400">
              {{ darkMode ? 'Mode clair' : 'Mode sombre' }}
            </span>
          </div>
          <div
            class="w-8 h-4 rounded-full transition-colors duration-300 relative flex-shrink-0"
            [class.bg-violet-500]="darkMode"
            [class.bg-gray-200]="!darkMode"
          >
            <div
              class="absolute top-0.5 w-3 h-3 bg-white rounded-full shadow transition-transform duration-300"
              [class.translate-x-4]="darkMode"
              [class.translate-x-0.5]="!darkMode"
            ></div>
          </div>
        </button>

        <!-- User card -->
        <div
          class="flex items-center gap-3 px-3 py-2 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800/50 transition cursor-pointer"
          (click)="logout()"
        >
          <div
            class="w-8 h-8 rounded-full bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 shadow-md shadow-violet-200 dark:shadow-violet-900/30"
          >
            {{ currentUser?.display_name?.charAt(0) || 'U' }}
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-gray-800 dark:text-white text-xs font-semibold truncate">
              {{ currentUser?.display_name || 'UNILOG User' }}
            </p>
            <p class="text-gray-400 dark:text-gray-500 text-[10px] truncate">
              {{ currentUser?.role || 'session active' }}
            </p>
          </div>
          <div
            class="w-2 h-2 rounded-full bg-emerald-400 flex-shrink-0 shadow shadow-emerald-200"
          ></div>
        </div>

        <button
          type="button"
          (click)="logout()"
          class="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl bg-rose-50 dark:bg-rose-900/20 text-rose-600 dark:text-rose-300 hover:bg-rose-100 dark:hover:bg-rose-900/35 transition-all duration-200"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1m0-10V7m-8 12h5a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
          <span class="text-sm font-semibold">Déconnexion</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main
      class="flex-1 overflow-auto bg-[#F5F6FA] dark:bg-[#0F1117] transition-colors duration-300"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</ng-container>

<ng-template #publicView>
  <router-outlet></router-outlet>
</ng-template>
